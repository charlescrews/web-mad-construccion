# Genera la web, la comprueba y la publica en GitHub Pages en cada push a main.
# Para publicar por SFTP en un hosting (p. ej. IONOS) en vez de Pages, crea la variable
# de repositorio DEPLOY_SFTP = true (Settings > Secrets and variables > Actions > Variables).
# Acciones fijadas por commit (SHA), no por etiqueta: una etiqueta se puede mover (ataque a trivy-action, marzo de 2026).
# Dependabot las actualiza solo (.github/dependabot.yml).
name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # La API de la plantilla C avisa cuando cambia el catálogo (CATALOG_SOURCE=db, WEB_REPO y WEB_REPO_TOKEN).
  repository_dispatch:
    types: [catalogo]
  # Con catálogo desde la API, una vez al día para que fichas y disponibilidad estén al día aunque nadie toque nada.
  # schedule:
  #   - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_SFTP != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Ubuntu fijo: con ubuntu-latest (26.04 desde nov 2026) Playwright 1.56 no instala Chromium y el workflow falla.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Accesibilidad en navegador (skill accesibilidad-cliente): axe-core (npm) + Playwright con Chromium.
      - run: npm ci --ignore-scripts
      - run: pip install markdown playwright==1.56.0 Pillow==12.3.0 fonttools==4.66.1 brotli==1.2.0 && python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -t . -q
      - run: python build.py
      - run: python tools/check.py
      - run: python tools/axe.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # v5: incluye los archivos ocultos si se pide. Hace falta para /.well-known (enlaces con las apps, site.json > app).
      # build.py no copia ningún oculto de static/: solo publica los que genera él.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
